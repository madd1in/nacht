<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { position: fixed; inset: 0; box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); display: flex; align-items: center; justify-content: center; font-family: monospace; color: #fcfcfc; }
  #wrap { position: relative; line-height: 0; flex: none; }
  canvas#screen {
    display: block; image-rendering: pixelated; image-rendering: crisp-edges;
    background: #000;
  }
  #touch { position: fixed; inset: 0; pointer-events: none; display: none; user-select: none; -webkit-user-select: none; }
  body.touch #touch { display: block; }
  .tbtn {
    position: absolute; pointer-events: none; border-radius: 50%;
    background: rgba(252, 252, 252, .07); border: 2px solid rgba(252, 252, 252, .26);
    color: rgba(252, 252, 252, .6); font: bold 16px monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .tbtn.on { background: rgba(216, 40, 0, .4); border-color: rgba(252, 220, 160, .7); }
  #tJump { right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(30px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; }
  #tAtk { right: calc(104px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: 80px; height: 80px; }
  #tSub { right: calc(64px + env(safe-area-inset-right, 0px)); bottom: calc(118px + env(safe-area-inset-bottom, 0px)); width: 58px; height: 58px; font-size: 12px; }
  #tStart { right: 12px; top: 12px; width: 46px; height: 32px; border-radius: 10px; font-size: 12px; }
  #stickBase { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%;
    border: 2px solid rgba(252, 252, 252, .25); background: rgba(252, 252, 252, .05); display: none; }
  #stickBase.on { display: block; }
  #stickKnob { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(216, 40, 0, .45); border: 2px solid rgba(252, 252, 252, .5); }
  #stickHint { position: absolute; left: calc(16px + env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font: 11px monospace; color: rgba(252, 252, 252, .35); }
  #crt {
    position: absolute; inset: 0; pointer-events: none; --s: 3px; --a: 1.6px;
    background:
      radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,.42) 100%),
      repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) var(--a), rgba(0,0,0,.2) var(--a), rgba(0,0,0,.2) var(--s));
  }
  #crt.off { display: none; }
  canvas#screen.crt { filter: saturate(1.15) contrast(1.06) brightness(1.06); }
</style>

<body>
<div id="wrap"><canvas id="screen" width="256" height="240" aria-label="NACHTMAHR Spielfeld"></canvas><div id="crt"></div></div>
<div id="touch" aria-hidden="true">
  <div id="stickBase"><div id="stickKnob"></div></div>
  <div id="stickHint">LINKE HÄLFTE: STEUERN</div>
  <div class="tbtn" id="tJump" data-k="jump">A</div>
  <div class="tbtn" id="tAtk" data-k="attack">B</div>
  <div class="tbtn" id="tSub" data-k="sub">SUB</div>
  <div class="tbtn" id="tStart" data-k="start">II</div>
</div>
